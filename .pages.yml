# Pages CMS configuration: lets the Pulita team edit News, Projects and
# social links from https://app.pagescms.org without touching code.
# Images uploaded in the CMS are saved to assets/images/uploads/, PDFs to assets/docs/uploads/.
media:
  - name: images
    label: 'Images'
    input: pulita-website/assets/images/uploads
    output: /assets/images/uploads
    categories: [image]
  - name: documents
    label: 'Documents (PDF)'
    input: pulita-website/assets/docs/uploads
    output: /assets/docs/uploads
    categories: [document]

content:
  - name: news
    label: 'News & Exhibitions'
    type: file
    path: pulita-website/content/news.json
    format: json
    list: true
    fields:
      - name: title
        label: 'Title'
        type: string
        required: true
      - name: type
        label: 'Type'
        type: select
        options:
          values: [News, Exhibition, Event, Project]
      - name: date
        label: 'Date (exhibitions with a future date show under "Upcoming events")'
        type: date
      - name: location
        label: 'Location'
        type: string
      - name: image
        label: 'Photo'
        type: image
        options:
          media: images
      - name: summary
        label: 'Summary (1-3 sentences)'
        type: text
      - name: link
        label: 'Link (optional, e.g. an event website or a page on this site)'
        type: string

  - name: projects
    label: 'Projects'
    type: file
    path: pulita-website/content/projects.json
    format: json
    list: true
    fields:
      - name: title
        label: 'Project name'
        type: string
        required: true
      - name: capacity
        label: 'Capacity (e.g. 450kVA, or MRU / Station)'
        type: string
      - name: fuel
        label: 'Fuel'
        type: select
        options:
          values: [LPG, CNG, Biogas, Flare gas, Landfill gas, Dual-fuel]
      - name: location
        label: 'Location'
        type: string
      - name: sector
        label: 'Sector (used by the gallery filters)'
        type: select
        options:
          values: [Healthcare, Telecom, Gas station, Industrial, Commercial & residential, Other]
      - name: image
        label: 'Cover photo (shown on the card)'
        type: image
        options:
          media: images
      - name: photos
        label: 'All project photos (opened when a visitor taps the project)'
        type: image
        options:
          media: images
        list: true
      - name: summary
        label: 'Short description'
        type: text
      - name: application
        label: 'Application (e.g. Hospital power supply)'
        type: string
      - name: equipment
        label: 'Equipment supplied'
        type: text
      - name: scope
        label: 'Project scope (e.g. supply, installation, commissioning)'
        type: string
      - name: results
        label: 'Operating results (mark estimates with *)'
        type: text
      - name: featured
        label: 'Show on the home page'
        type: boolean

  - name: settings
    label: 'Social media links'
    type: file
    path: pulita-website/content/settings.json
    format: json
    fields:
      - name: instagram
        label: 'Instagram page URL, e.g. https://instagram.com/pulitaenergy'
        type: string
      - name: linkedin
        label: 'LinkedIn page URL'
        type: string
      - name: twitter
        label: 'X (Twitter) page URL, e.g. https://x.com/pulitaenergy'
        type: string
      - name: facebook
        label: 'Facebook page URL, e.g. https://facebook.com/pulitaenergy'
        type: string

  - name: partners
    label: 'Gas supply partners'
    type: file
    path: pulita-website/content/partners.json
    format: json
    list: true
    fields:
      - name: name
        label: 'Company name'
        type: string
        required: true
      - name: logo
        label: 'Logo (PNG or SVG, transparent background, wide format)'
        type: image
        options:
          media: images
      - name: website
        label: 'Website (optional, starting with https://)'
        type: string

  - name: contact
    label: 'Contact details'
    type: file
    path: pulita-website/content/contact.json
    format: json
    fields:
      - name: phone
        label: 'Contact 1: phone number (also shown in the top bar)'
        type: string
      - name: email
        label: 'Contact 1: email (also used by the website forms)'
        type: string
      - name: whatsapp
        label: 'Contact 1: WhatsApp number, with country code (used by every WhatsApp button and form)'
        type: string
      - name: phone2
        label: 'Contact 2: phone number (leave empty to hide)'
        type: string
      - name: email2
        label: 'Contact 2: email (leave empty to hide)'
        type: string
      - name: whatsapp2
        label: 'Contact 2: WhatsApp number, with country code (leave empty to hide)'
        type: string
      - name: lagos_address
        label: 'Lagos office address'
        type: string
      - name: abuja_address
        label: 'Abuja warehouse location (shown in footer and contact page)'
        type: string
      - name: factory_address
        label: 'Factory / headquarters address in China (Contact page)'
        type: text

  - name: banner
    label: 'Home page banner (photos change every 3 seconds behind the headline)'
    type: file
    path: pulita-website/content/banner.json
    format: json
    list: true
    fields:
      - name: image
        label: 'Photo (landscape, at least 2000 px wide, real installations)'
        type: image
        options:
          media: images
        required: true
      - name: caption
        label: 'Caption (e.g. Real installation: CNG MRU refilling station, Abuja)'
        type: string

  - name: spare-parts
    label: 'Spare parts'
    type: file
    path: pulita-website/content/spare-parts.json
    format: json
    list: true
    fields:
      - name: name
        label: 'Part name'
        type: string
        required: true
      - name: tag
        label: 'Category tag (e.g. Ignition, Sensors, Filters)'
        type: string
      - name: description
        label: 'Short description (one sentence)'
        type: text
      - name: photos
        label: 'Photos (the first one shows on the card; visitors can swipe through all of them)'
        type: image
        options:
          media: images
        list: true

  - name: datasheets
    label: 'Product datasheets (PDF per model)'
    type: file
    path: pulita-website/content/datasheets.json
    format: json
    list: true
    fields:
      - name: product
        label: 'Product'
        type: select
        options:
          values: [CNG generator, LPG generator, Biogas generator, MRU]
      - name: model
        label: 'Model, exactly as shown in the table (e.g. PLT-100GF or MRU 600)'
        type: string
        required: true
      - name: file
        label: 'Datasheet PDF (replaces the PDF button for this model)'
        type: file
        options:
          media: documents
          extensions: [pdf]
